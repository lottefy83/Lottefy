<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>吉利蔬菜叫菜 APP｜深灰科技藍版 </title>
<style>
/* 質感深灰色 (Dark Gray) 搭配 科技天空藍 (Sky Blue) */
:root {
  --bg: #202124; 
  --card: #2d2e31; 
  --text: #e8eaed; 
  --muted: #9aa0a6; 
  --line: rgba(255, 255, 255, 0.12); 
  --green: #1e8e3e; 
  --green-dark: #81c995;
  --soft: #3c4043; 
  --red: #f28b82; 
  --accent: #8ab4f8; 
  --accent-light: #aecbfa; 
  --shadow: 0 8px 20px rgba(0, 0, 0, 0.3); 
  --radius: 16px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  margin: 0; padding: 0;
  height: 100%; overflow: hidden; 
  background: var(--bg); color: var(--text);
  font-family: "PingFang TC", "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif;
  color-scheme: dark;
}
.app { 
  display: flex; flex-direction: column; 
  height: 100vh; width: 100vw;
}

.topbar {
  flex-shrink: 0; 
  padding: max(12px, env(safe-area-inset-top)) 14px 12px;
  background: rgba(32, 33, 36, 0.98);
  border-bottom: 1px solid var(--line);
  z-index: 10;
}
.top-inner {
  max-width: 1600px; margin: 0 auto;
  display: grid; 
  grid-template-columns: 220px minmax(0,1fr) 350px 420px; 
  gap: 14px; align-items: start; 
}
.brand h1 { margin: 0 0 5px 0; font-size: 22px; line-height: 1.2; color: var(--accent-light); font-weight: 900; }
.sub { color: var(--muted); font-size: 12px; line-height: 1.35; }

.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px; min-width: 0;
}
.panel-title {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px;
}
.panel-title strong { font-size: 15px; color: var(--accent-light); font-weight: 900; }
.panel-title small { color: var(--muted); font-size: 11px; white-space: nowrap; }

/* ★ 修復日期跑版：限制網格元素的最小寬度，防止內部 input 撐破 */
.meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meta-grid > div { min-width: 0; }

label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; font-weight: 600; }

/* ★ 修復日期跑版：強制 max-width: 100% 以及移除 iOS 預設樣式 */
input,select {
  width: 100%; max-width: 100%; border: 1px solid rgba(255, 255, 255, 0.15); background: #303134; color: var(--text);
  border-radius: 10px; padding: 8px 10px; outline: none; min-width: 0; transition: 0.2s; font-size: 14px;
}
input[type="date"] { -webkit-appearance: none; }
input:focus,select:focus { 
  border-color: var(--accent); box-shadow: 0 0 0 3px rgba(138, 180, 248, 0.2); 
}

.search { position: relative; }
.search input { height: 40px; padding-left: 36px; }
.search span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--accent); font-size: 16px; }
.stat-mini {
  background: var(--soft); border: 1px solid var(--line); border-radius: 10px;
  padding: 6px; text-align: center;
}
.stat-mini b { display: block; font-size: 15px; line-height: 1; color: var(--accent-light); font-weight: 900; }
.stat-mini small { color: var(--muted); font-size: 11px; font-weight: 600; }

.history-panel { display: flex; flex-direction: column; }
.history-list { 
  overflow-y: auto; 
  max-height: 180px; 
  display: grid; gap: 8px; padding-right: 4px; 
}

.wrap {
  flex: 1; 
  min-height: 0; 
  max-width: 1600px; margin: 0 auto; width: 100%;
  padding: 14px;
  display: grid; grid-template-columns: minmax(0,1fr) 390px; gap: 14px;
}

.main-content { 
  overflow-y: auto; 
  min-height: 0; 
  padding-right: 8px; 
}

.right { 
  display: flex; flex-direction: column; 
  min-height: 0; 
}
.right-panel-wrapper {
  flex: 1; 
  display: flex; flex-direction: column; 
  padding: 0; 
  overflow: hidden; 
}
.right-header {
  flex-shrink: 0; 
  padding: 14px 14px 0 14px;
}
.selected-panel { 
  flex: 1; 
  overflow-y: auto; 
  min-height: 0; 
  padding: 14px; 
  display: flex; flex-direction: column; gap: 8px;
}

.blocks {
  display: grid; gap: 14px; 
  grid-template-columns: repeat(4, minmax(0,1fr));
}
.block {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; min-width: 0;
}
.block-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 13px; background: linear-gradient(180deg,#35373a,#2d2e31);
  border-bottom: 1px solid var(--line);
}
.block-title { font-weight: 900; font-size: 16px; color: var(--accent-light); }
.block-count {
  color: var(--accent-light); background: var(--soft); border-radius: 999px;
  padding: 4px 9px; font-size: 12px; font-weight: 800; white-space: nowrap; border: 1px solid rgba(138, 180, 248, 0.25);
}

.row {
  display: grid; grid-template-columns: minmax(60px,1fr) 4.6em 3.8em;
  gap: 6px; padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center;
}
.row:last-child { border-bottom: 0; }
.row-head {
  background: #292a2d; color: #9aa0a6; font-size: 12px; font-weight: 900;
  position: sticky; top: 0; z-index: 1;
}
.name {
  font-weight: 800; line-height: 1.25; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
  font-size: 18px; letter-spacing: 2px; color: var(--text);
}
.name.custom::after {
  content: "新增"; margin-left: 4px; font-size: 10px; color: #202124;
  background: var(--accent-light); border-radius: 999px; padding: 2px 5px; letter-spacing: normal;
}
.qty-wrap { width: 4.6em; } 
.qty-input { text-align: center; padding-left: 2px !important; padding-right: 2px !important; font-weight: 700; color: var(--accent-light); } 
.price-select { width: 3.8em !important; text-align: center; padding-left: 2px !important; padding-right: 0px !important; font-weight: 600;}

.row input, .row select { 
  padding: 6px 4px; border-radius: 8px; font-size: 18px; 
}

.selected-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 4px; }
.btn {
  border: 1px solid rgba(255,255,255,0.2); background: var(--soft); color: #e8eaed; transition: 0.2s;
  border-radius: 12px; padding: 12px; font-weight: 900; cursor: pointer;
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 6px 15px rgba(30, 142, 62, 0.2); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: #202124; box-shadow: 0 6px 15px rgba(138, 180, 248, 0.15); }
.btn.danger { color: var(--red); background: rgba(242, 139, 130, 0.1); border-color: rgba(242, 139, 130, 0.2); }

.selected-item,.history-item {
  display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px; align-items: center;
  border: 1px solid var(--line); border-radius: 12px; padding: 10px; background: #303134; transition: 0.2s;
}
.selected-item:hover,.history-item:hover { border-color: var(--accent); }
.selected-item strong,.history-item strong {
  display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  letter-spacing: 1px; color: var(--accent-light); font-weight: 900;
}
.selected-item small,.history-item small { color: var(--muted); line-height: 1.35; font-weight: 600; }

.history-actions { display: flex; gap: 6px; }
.del, .download-record, .del-record {
  border: 0; border-radius: 9px; padding: 8px 10px; font-weight: 900; cursor: pointer; white-space: nowrap; transition: 0.2s;
}
.del { background: rgba(242, 139, 130, 0.15); color: var(--red); }
.download-record { background: var(--soft); color: var(--accent-light); border: 1px solid rgba(255,255,255,0.1); }
.del-record { background: rgba(242, 139, 130, 0.15); color: var(--red); padding: 8px; border-radius: 9px; }

.empty {
  text-align: center; color: #9aa0a6; border: 1px dashed rgba(138, 180, 248, 0.4);
  border-radius: 12px; padding: 20px; background: transparent; line-height: 1.6; font-weight: 600;
  margin-top: 4px;
}

.mini-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: end; margin-bottom: 8px;}
.mini-grid.three { grid-template-columns: 85px minmax(0,1fr) auto; }
.mini-btn {
  border: 0; background: var(--accent); color: #202124; border-radius: 8px;
  padding: 8px 12px; font-weight: 900; cursor: pointer; white-space: nowrap; font-size: 13px;
}
.option-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; min-height: 24px; }
.option-tag {
  display: inline-flex; align-items: center; gap: 5px; background: var(--soft); color: var(--accent-light);
  border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 800; border: 1px solid rgba(255,255,255,0.1);
}
.option-tag button { border: 0; background: transparent; color: var(--accent-light); cursor: pointer; font-weight: 900; padding: 0 2px; }

.toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(12px);
  width: min(430px,calc(100% - 28px)); background: #e8eaed; color: #202124; font-weight: bold; letter-spacing: 1px;
  border-radius: 14px; padding: 12px 14px; text-align: center; opacity: 0;
  pointer-events: none; transition: .22s; z-index: 9999; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ★ 懸浮回頂層按鈕 (FAB) 樣式 */
.fab-top {
  position: fixed; bottom: 30px; right: 20px; z-index: 9999;
  width: 50px; height: 50px; border-radius: 50%;
  background: var(--accent); color: #202124;
  border: none; box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; opacity: 0; pointer-events: none;
  transform: translateY(20px); transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
}
.fab-top.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
.fab-top:active { transform: scale(0.9); }
.fab-top svg { width: 26px; height: 26px; stroke-width: 2.5; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--soft); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #5f6368; }

/* =========================================
   手機與平板防跑版 (完美響應式)
========================================= */
@media (max-width: 1400px) {
  .blocks { grid-template-columns: repeat(3, minmax(0,1fr)); }
  .top-inner { grid-template-columns: 180px minmax(0,1fr) 300px 380px; }
  .brand h1 { font-size: 20px; }
}

@media (max-width: 1150px) {
  html, body { height: auto; overflow: visible; }
  .app { height: auto; display: block; }
  .wrap { 
    display: flex; flex-direction: column; 
    height: auto; overflow: visible; padding-top: 0;
  }
  .main-content { overflow: visible; padding-right: 0; height: auto; }
  .blocks { grid-template-columns: repeat(2, minmax(0,1fr)); }
  
  .right { margin-top: 14px; }
  .right-panel-wrapper { max-height: 450px; } 
  
  .top-inner { grid-template-columns: repeat(2, 1fr); }
  .brand { grid-column: span 2; display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin-bottom: 0; }
}

@media (max-width: 850px) {
  .blocks { grid-template-columns: 1fr; }
  .top-inner { grid-template-columns: 1fr; }
  .brand { grid-column: span 1; flex-direction: column; align-items: flex-start; gap: 4px; }
  .history-list { max-height: 250px; }
  
  /* ★ 進一步優化手機版日期輸入框，防止撐開版面 */
  input[type="date"] { padding: 8px 6px; font-size: 13px; letter-spacing: -0.5px; }
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-inner">
      <div class="brand">
        <h1>吉利蔬菜叫菜</h1>
        <div class="sub">請好好使用我ㄛ！</div>
      </div>

      <!-- ★ 加上 ID 以供 JS 識別搬移 -->
      <div class="panel" id="panel-today">
        <div class="panel-title"><strong>今日資料</strong><small id="baseCountText"></small></div>
        <div class="meta-grid">
          <div><label>店名</label><input id="shopName" placeholder="請輸入店名"></div>
          <div><label>日期</label><input id="orderDate" type="date"></div>
          <div><label>廠商</label><input id="supplierName" value="吉利蔬菜"></div>
          <div><label>電話</label><input id="phone" value="0926-270912"></div>
        </div>
        <div style="margin-top:10px;">
          <div class="search"><span>🔎</span><input id="searchInput" placeholder="搜尋品名，例如：高麗菜、香菇" oninput="renderBlocks()"></div>
          <div style="display:flex; gap:8px; margin-top:8px;">
            <div class="stat-mini" style="flex:1;"><b id="totalItemCount">0</b><small>總品項</small></div>
            <div class="stat-mini" style="flex:1;"><b>8</b><small>直行</small></div>
            <div class="stat-mini" style="flex:1;"><b id="selectedCountA">0</b><small>已點</small></div>
          </div>
        </div>
      </div>

      <div class="panel" id="panel-new">
        <div class="panel-title"><strong>新增設定</strong><small>單價 / 品名</small></div>
        
        <label>1. 新增單價選項</label>
        <div class="mini-grid">
          <input id="newPriceOption" placeholder="例如：箱、袋、條">
          <button class="mini-btn" onclick="addPriceOption()">新增</button>
        </div>
        <div class="option-tags" id="priceOptionTags"></div>

        <label>2. 自行增加品項</label>
        <div class="mini-grid three">
          <select id="newItemBlock"></select>
          <input id="newItemName" placeholder="輸入品名">
          <button class="mini-btn" onclick="addCustomItem()">新增</button>
        </div>
      </div>

      <div class="panel history-panel" id="panel-history">
        <div class="panel-title"><strong>叫菜紀錄</strong><small id="historyCount">0 筆</small></div>
        
        <div style="display:flex; gap:8px; margin-bottom:8px;">
          <input type="date" id="historyDateFilter" onchange="renderHistory()" style="border-radius:10px; padding:6px 10px; flex:1; font-size:14px;">
          <button class="mini-btn" style="background:var(--soft); color:var(--text); border:1px solid var(--line); border-radius:10px;" onclick="document.getElementById('historyDateFilter').value=''; renderHistory()">清除</button>
        </div>
        <div id="historyListTop" class="history-list"></div>
      </div>

    </div>
  </header>

  <main class="wrap" id="mainWrap">
    <section class="main-content">
      <div id="blockContainer" class="blocks"></div>
    </section>

    <!-- ★ 右側面板：會根據螢幕寬度自動移動 -->
    <aside class="right" id="panel-selected">
      <div class="panel right-panel-wrapper">
        <div class="right-header">
          <div class="panel-title" style="margin-bottom:8px;"><strong>已點品項</strong><small id="selectedCountB">0 筆</small></div>
          <div class="selected-actions">
            <button class="btn primary" onclick="exportImage()">匯出圖檔</button>
            <button class="btn accent" onclick="saveCurrentRecord(false)">儲存紀錄</button>
            <button class="btn" onclick="copyLastOrder()">複製上次</button>
            <button class="btn danger" onclick="clearOrder()">清空</button>
          </div>
        </div>
        <div id="selectedList" class="selected-panel"></div>
      </div>
    </aside>
  </main>
</div>

<datalist id="defaultQtys">
  <option value="1"></option><option value="2"></option><option value="3"></option>
  <option value="4"></option><option value="5"></option><option value="6"></option>
  <option value="7"></option><option value="8"></option><option value="9"></option>
  <option value="10"></option>
</datalist>

<div id="toast" class="toast"></div>

<!-- ★ 回頂層按鈕 -->
<button class="fab-top" id="fabTop" onclick="scrollToTop()" title="回到頂部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>

<script>

", "鹽水雞", "油雞", "烤鴨", "帶頭烤鴨", "生雞", "生鴨", "五香肉卷", "大香腸", "小香腸", "香腸片", "培根片", "紅燒肉", "叉燒肉"]}];
const DEFAULT_PRICE_OPTIONS = ['兩','斤','包','塊','盒','板'];

const LS_KEYS = {
  priceOptions: 'jili-price-options-v6',
  customItems: 'jili-custom-items-v6',
  order: 'jili-order-current-v6',
  history: 'jili-order-history-v6',
  meta: 'jili-current-meta-v6'
};

let priceOptions = JSON.parse(localStorage.getItem(LS_KEYS.priceOptions) || JSON.stringify(DEFAULT_PRICE_OPTIONS));
let customItems = JSON.parse(localStorage.getItem(LS_KEYS.customItems) || '[]');
let order = JSON.parse(localStorage.getItem(LS_KEYS.order) || '{}');
let historyRecords = JSON.parse(localStorage.getItem(LS_KEYS.history) || '[]');
let currentMeta = JSON.parse(localStorage.getItem(LS_KEYS.meta) || '{}');

function idOf(blockName,itemName,index) { return `${blockName}__${index}__${itemName}`; }
function escapeHtml(v) { return String(v ?? '').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;"); }
function jsArg(v) { return JSON.stringify(String(v)); }
function isPicked(row) {
  const q = String(row?.qty ?? '').trim();
  return (q !== '' && q !== '0');
}

function getBlocks(custom = customItems) {
  return BASE_BLOCKS.map(block => {
    const baseItems = block.items.map((name, index) => ({ id:idOf(block.name, name, index), name, block:block.name, custom:false }));
    const addedItems = custom.filter(item => item.block === block.name).map(item => ({ ...item, custom:true }));
    return { name:block.name, items:[...baseItems, ...addedItems] };
  });
}

function totalItems(custom = customItems) {
  return BASE_BLOCKS.reduce((sum, b) => sum + b.items.length, 0) + custom.length;
}

function selectedItems(srcOrder = order, srcCustom = customItems) {
  const productMap = {};
  getBlocks(srcCustom).forEach(block => block.items.forEach(item => productMap[item.id] = item));
  const result = [];
  Object.keys(srcOrder).forEach(id => {
    const row = srcOrder[id];
    const product = productMap[id];
    if (product && row && isPicked(row)) {
      result.push({ ...product, qty:row.qty || '', price:row.price || '' });
    }
  });
  const orderIndex = {};
  getBlocks(srcCustom).forEach((block, bi) => block.items.forEach((item, ii) => orderIndex[item.id] = bi*1000 + ii));
  result.sort((a,b) => (orderIndex[a.id] || 0) - (orderIndex[b.id] || 0));
  return result;
}

function saveCurrentMeta() {
  currentMeta = {
    shopName: document.getElementById('shopName').value || '',
    orderDate: document.getElementById('orderDate').value || '',
    supplierName: document.getElementById('supplierName').value || '吉利蔬菜',
    phone: document.getElementById('phone').value || '0926-270912'
  };
  localStorage.setItem(LS_KEYS.meta, JSON.stringify(currentMeta));
}

function saveAll() {
  saveCurrentMeta();
  localStorage.setItem(LS_KEYS.order, JSON.stringify(order));
  localStorage.setItem(LS_KEYS.priceOptions, JSON.stringify(priceOptions));
  localStorage.setItem(LS_KEYS.customItems, JSON.stringify(customItems));
  localStorage.setItem(LS_KEYS.history, JSON.stringify(historyRecords));
}

function loadMetaToForm() {
  const today = new Date();
  document.getElementById('shopName').value = currentMeta.shopName || '';
  document.getElementById('orderDate').value = currentMeta.orderDate || `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  document.getElementById('supplierName').value = currentMeta.supplierName || '吉利蔬菜';
  document.getElementById('phone').value = currentMeta.phone || '0926-270912';
}

function updateCounts() {
  document.getElementById('totalItemCount').textContent = totalItems();
  document.getElementById('baseCountText').textContent = `原始 268 項，新增 ${customItems.length} 項`;
}

function renderBlockSelect() {
  document.getElementById('newItemBlock').innerHTML = BASE_BLOCKS.map(b => `<option value="${escapeHtml(b.name)}">${escapeHtml(b.name)}</option>`).join('');
}

function renderPriceOptions() {
  document.getElementById('priceOptionTags').innerHTML = priceOptions.map(option => `
    <span class="option-tag">${escapeHtml(option)}<button onclick='removePriceOption(${jsArg(option)})' title="刪除">×</button></span>
  `).join('');
}

function addPriceOption() {
  const input = document.getElementById('newPriceOption');
  const value = input.value.trim();
  if (!value) return toast('請輸入要新增的單價選項');
  if (priceOptions.includes(value)) return toast('這個單價選項已經存在');
  priceOptions.push(value);
  input.value = '';
  saveAll();
  renderPriceOptions();
  renderBlocks();
  toast('已新增單價選項');
}

function removePriceOption(option) {
  if (DEFAULT_PRICE_OPTIONS.includes(option)) return toast('預設選項不建議刪除');
  priceOptions = priceOptions.filter(x => x !== option);
  saveAll();
  renderPriceOptions();
  renderBlocks();
  renderSelected();
  toast('已刪除單價選項');
}

function addCustomItem() {
  const block = document.getElementById('newItemBlock').value;
  const input = document.getElementById('newItemName');
  const name = input.value.trim();
  if (!name) return toast('請輸入品名');
  const exists = getBlocks().some(b => b.name === block && b.items.some(item => item.name === name));
  if (exists) return toast('這個區塊已經有相同品名');
  customItems.push({ id:`custom_${Date.now()}_${Math.random().toString(16).slice(2)}`, block, name });
  input.value = '';
  saveAll();
  updateCounts();
  renderBlocks();
  toast('已新增品名');
}

function updateItem(id, field, value) {
  if (!order[id]) order[id] = { qty:'', price:'' };
  order[id][field] = value;
  if (!isPicked(order[id])) {
    delete order[id];
  }
  saveAll();
  renderSelected();
}

function updateQtyInput(input, id) {
  updateItem(id, 'qty', input.value);
}

function renderBlocks() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const container = document.getElementById('blockContainer');
  container.innerHTML = getBlocks().map(block => {
    const rows = block.items.filter(item => !q || item.name.toLowerCase().includes(q) || block.name.toLowerCase().includes(q));
    if (!rows.length) return '';
    return `
      <div class="block">
        <div class="block-head">
          <div class="block-title">${escapeHtml(block.name)}</div>
          <div class="block-count">${block.items.length} 項</div>
        </div>
        <div class="row row-head"><div>品名</div><div>數量</div><div>單價</div></div>
        ${rows.map(item => {
          const v = order[item.id] || { qty:'', price:'' };
          return `
            <div class="row">
              <div class="name ${item.custom ? 'custom' : ''}" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
              <div class="qty-wrap">
                <input class="qty-input" 
                  list="defaultQtys" 
                  maxlength="6" 
                  value="${escapeHtml(v.qty)}" 
                  placeholder="0"
                  oninput='updateQtyInput(this, ${jsArg(item.id)})'
                  onchange='updateQtyInput(this, ${jsArg(item.id)})'>
              </div>
              <select class="price-select" onchange='updateItem(${jsArg(item.id)}, "price", this.value)'>
                <option value="" ${!v.price ? 'selected' : ''}>選</option>
                ${priceOptions.map(option => `<option value="${escapeHtml(option)}" ${v.price === option ? 'selected' : ''}>${escapeHtml(option)}</option>`).join('')}
              </select>
            </div>`;
        }).join('')}
      </div>`;
  }).join('') || `<div class="empty" style="border:1px dashed var(--line); background:transparent;">找不到符合的品項</div>`;
}

function renderSelected() {
  const items = selectedItems();
  document.getElementById('selectedCountA').textContent = items.length;
  document.getElementById('selectedCountB').textContent = `${items.length} 筆`;
  const box = document.getElementById('selectedList');
  if (!items.length) {
    box.innerHTML = `<div class="empty" style="margin-top:0">尚未點菜<br>請在左側輸入數量</div>`;
    return;
  }
  box.innerHTML = items.map(item => `
    <div class="selected-item">
      <div>
        <strong title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</strong>
        <small>${escapeHtml(item.block)}｜${escapeHtml(item.qty || '-')} ${escapeHtml(item.price || '')}</small>
      </div>
      <button class="del" onclick='removeItem(${jsArg(item.id)})'>刪除</button>
    </div>
  `).join('');
}

function removeItem(id) {
  delete order[id];
  saveAll();
  renderBlocks();
  renderSelected();
}

function recordMeta() {
  return {
    shopName: document.getElementById('shopName').value || '',
    orderDate: document.getElementById('orderDate').value || '',
    supplierName: document.getElementById('supplierName').value || '吉利蔬菜',
    phone: document.getElementById('phone').value || ''
  };
}

function buildSnapshot() {
  return {
    id:`record_${Date.now()}`,
    createdAt:new Date().toISOString(),
    meta:recordMeta(),
    order:JSON.parse(JSON.stringify(order)),
    customItems:JSON.parse(JSON.stringify(customItems)),
    priceOptions:JSON.parse(JSON.stringify(priceOptions))
  };
}

function saveCurrentRecord(silent = false) {
  if (!selectedItems().length) {
    if (!silent) toast('請先輸入至少一個品項');
    return null;
  }
  const snapshot = buildSnapshot();
  historyRecords.unshift(snapshot);
  historyRecords = historyRecords.slice(0,50);
  saveAll();
  renderHistory();
  if (!silent) toast('已儲存本次叫菜紀錄');
  return snapshot;
}

function copyLastOrder() {
  if (!historyRecords.length) return toast('目前沒有可複製的紀錄');
  order = JSON.parse(JSON.stringify(historyRecords[0].order));
  const recordCustom = historyRecords[0].customItems || [];
  const exists = new Set(customItems.map(x => x.id));
  recordCustom.forEach(item => { if (!exists.has(item.id)) customItems.push(item); });
  saveAll();
  updateCounts();
  renderBlocks();
  renderSelected();
  toast('已複製上一次叫菜內容');
}

function clearOrder() {
  const hasData = selectedItems().length > 0;
  if (!hasData) return toast('目前沒有叫菜內容');
  if (!confirm('確定要清空今日叫菜內容嗎？')) return;
  saveCurrentRecord(true);
  order = {};
  saveAll();
  renderBlocks();
  renderSelected();
  toast('已清空，清空前內容已存入叫菜紀錄');
}

function deleteRecord(recordId) {
  if (!confirm('確定要刪除這筆叫菜紀錄嗎？刪除後無法恢復。')) return;
  historyRecords = historyRecords.filter(x => x.id !== recordId);
  saveAll();
  renderHistory();
  toast('已刪除紀錄');
}

function formatDateTime(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderHistory() {
  const box = document.getElementById('historyListTop');
  const filterDate = document.getElementById('historyDateFilter').value; 
  
  let displayRecords = historyRecords;
  if (filterDate) {
    displayRecords = historyRecords.filter(record => {
      if (record.meta?.orderDate) {
        return record.meta.orderDate === filterDate;
      } else {
        const d = new Date(record.createdAt);
        if (isNaN(d.getTime())) return false;
        const fallbackDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        return fallbackDate === filterDate;
      }
    });
  }

  document.getElementById('historyCount').textContent = `${displayRecords.length} 筆`;
  
  if (!displayRecords.length) {
    box.innerHTML = `<div class="empty" style="margin-top:0">尚無叫菜紀錄<br>或該日期沒有資料</div>`;
    return;
  }
  
  box.innerHTML = displayRecords.map(record => {
    const count = selectedItems(record.order, record.customItems || []).length;
    const titleDate = record.meta?.orderDate || formatDateTime(record.createdAt);
    const shop = record.meta?.shopName || '未填店名';
    return `
      <div class="history-item">
        <div style="min-width:0; overflow:hidden;">
          <strong>${escapeHtml(titleDate)}｜${escapeHtml(shop)}</strong>
          <small>${escapeHtml(formatDateTime(record.createdAt))}｜${count} 項</small>
        </div>
        <div class="history-actions">
          <button class="download-record" onclick='downloadRecordImage(${jsArg(record.id)})'>下載</button>
          <button class="del-record" onclick='deleteRecord(${jsArg(record.id)})' title="刪除紀錄">🗑️</button>
        </div>
      </div>`;
  }).join('');
}

function makeCanvas(snapshot = null) {
  const srcOrder = snapshot ? snapshot.order : order;
  const srcCustom = snapshot ? (snapshot.customItems || []) : customItems;
  const meta = snapshot ? snapshot.meta : recordMeta();

  const blocks = getBlocks(srcCustom);

  let maxRows = 0;
  blocks.forEach(b => { if(b.items.length > maxRows) maxRows = b.items.length; });
  if (maxRows < 37) maxRows = 37; 

  const marginX = 40;
  const marginY = 40;
  const titleAreaH = 80;
  const rowH = 32;
  const cols = 8;
  
  const subCols = [
    { label: '品  名', w: 105 },
    { label: '數量', w: 45 },
    { label: '單價', w: 45 },
    { label: '小計', w: 45 }
  ];
  
  const colW = subCols.reduce((sum, c) => sum + c.w, 0); 
  const width = marginX * 2 + cols * colW; 
  const height = marginY + titleAreaH + (maxRows + 2) * rowH + marginY; 

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = '#111827';
  ctx.strokeStyle = '#111827';
  ctx.lineWidth = 1;

  ctx.font = 'bold 36px "PingFang TC", "Microsoft JhengHei", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('吉      利      蔬      菜', marginX + 30, marginY + 40);

  ctx.font = '20px "PingFang TC", "Microsoft JhengHei", sans-serif';
  ctx.fillText(`店名： ${meta.shopName || ''}`, marginX + 600, marginY + 40);
  ctx.fillText(`(訂)0926-270912    Line ID : mimi86845959`, marginX + 1100, marginY + 40);

  let dateStr = '    月    日';
  if (meta.orderDate) {
    const d = new Date(meta.orderDate);
    if (!isNaN(d.getTime())) {
      dateStr = `${d.getMonth()+1} 月 ${d.getDate()} 日`;
    }
  }
  ctx.fillText(dateStr, width - marginX - 180, marginY + 40);

  const tableY = marginY + titleAreaH;

  ctx.beginPath();
  for (let r = 0; r <= maxRows + 2; r++) {
    const y = tableY + r * rowH;
    ctx.moveTo(marginX, y);
    ctx.lineTo(marginX + cols * colW, y);
  }
  ctx.stroke();

  ctx.textBaseline = 'middle';
  ctx.beginPath();

  for (let c = 0; c < cols; c++) {
    const blockX = marginX + c * colW;
    let currentX = blockX;

    ctx.moveTo(currentX, tableY);
    ctx.lineTo(currentX, tableY + (maxRows + 2) * rowH);

    for (let sc = 0; sc < subCols.length; sc++) {
      const scDef = subCols[sc];

      ctx.textAlign = 'center';
      ctx.font = '16px "PingFang TC", "Microsoft JhengHei", sans-serif';
      ctx.fillText(scDef.label, currentX + scDef.w / 2, tableY + rowH / 2);

      const block = blocks[c];
      if (block) {
        for (let r = 0; r < maxRows; r++) {
          const item = block.items[r];
          const cellY = tableY + (r + 1) * rowH + rowH / 2;

          if (item) {
            const orderedItem = srcOrder[item.id];
            const qRaw = orderedItem ? String(orderedItem.qty || '').trim() : '';
            const pRaw = orderedItem ? String(orderedItem.price || '').trim() : '';
            const isOrdered = (qRaw !== '' && qRaw !== '0');

            if (sc === 0) {
              ctx.textAlign = 'left';
              ctx.font = '15px "PingFang TC", "Microsoft JhengHei", sans-serif';
              ctx.letterSpacing = '2px';
              ctx.fillText(item.name, currentX + 6, cellY);
              ctx.letterSpacing = '0px'; 
            } else if (sc === 1) {
              ctx.textAlign = 'center';
              ctx.font = 'bold 16px sans-serif';
              if (isOrdered) ctx.fillText(qRaw, currentX + scDef.w / 2, cellY);
            } else if (sc === 2) {
              ctx.textAlign = 'center';
              ctx.font = 'bold 16px "PingFang TC", "Microsoft JhengHei", sans-serif';
              if (isOrdered) ctx.fillText(pRaw, currentX + scDef.w / 2, cellY);
            }
          }
        }
      }

      currentX += scDef.w;
      ctx.moveTo(currentX, tableY);
      ctx.lineTo(currentX, tableY + (maxRows + 2) * rowH);
    }

    const footY = tableY + (maxRows + 1) * rowH + rowH / 2;
    ctx.textAlign = 'center';
    ctx.font = '16px "PingFang TC", "Microsoft JhengHei", sans-serif';
    ctx.fillText('合    計', blockX + subCols[0].w / 2, footY);
  }

  ctx.stroke();

  return canvas;
}

function downloadCanvas(canvas, filename) {
  const a = document.createElement('a');
  a.download = filename;
  a.href = canvas.toDataURL('image/png');
  a.click();
}

function exportImage() {
  const items = selectedItems();
  if (!items.length) return toast('請先輸入至少一個品項');

  const missingPrices = items.filter(item => !item.price || item.price.trim() === '');
  if (missingPrices.length > 0) {
    const names = missingPrices.map(i => i.name).join('、');
    alert(`【匯出失敗】\n\n您有以下品項尚未設定單價：\n${names}\n\n請補齊單價後再進行匯出！`);
    return; 
  }

  const snapshot = saveCurrentRecord(true);
  const canvas = makeCanvas(snapshot);
  const date = snapshot.meta.orderDate || 'today';
  downloadCanvas(canvas, `吉利蔬菜叫菜單_${date}.png`);
  renderHistory();
  toast('已匯出圖檔，並儲存到叫菜紀錄');
}

function downloadRecordImage(recordId) {
  const record = historyRecords.find(x => x.id === recordId);
  if (!record) return toast('找不到這筆叫菜紀錄');
  const canvas = makeCanvas(record);
  const date = record.meta?.orderDate || formatDateTime(record.createdAt).replaceAll('/','-').replaceAll(':','');
  downloadCanvas(canvas, `吉利蔬菜叫菜單_紀錄_${date}.png`);
  toast('已下載該次叫菜圖檔');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

// ★ 手機版排版自動重整：將已點品項移動到今日資料正下方
function arrangeMobileLayout() {
  const isMobile = window.innerWidth <= 850;
  const rightPanel = document.getElementById('panel-selected');
  const panelToday = document.getElementById('panel-today');
  const mainWrap = document.getElementById('mainWrap');

  if (isMobile) {
    if (panelToday.nextElementSibling !== rightPanel) {
      panelToday.after(rightPanel); // 移動到今日資料下方
    }
  } else {
    if (!mainWrap.contains(rightPanel)) {
      mainWrap.appendChild(rightPanel); // 復原到右側雙欄區
    }
  }
}

// ★ 懸浮回頂層按鈕邏輯
const fabTop = document.getElementById('fabTop');
const mainContent = document.querySelector('.main-content');

function checkFabVisibility() {
  // 判斷當下是內部獨立捲軸 (電腦) 還是全頁捲軸 (手機)
  const scrollTop = window.innerWidth > 1150 ? mainContent.scrollTop : window.scrollY;
  if (scrollTop > 300) {
    fabTop.classList.add('show');
  } else {
    fabTop.classList.remove('show');
  }
}

function scrollToTop() {
  if (window.innerWidth > 1150) {
    mainContent.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// 監聽滾動與調整視窗大小事件
window.addEventListener('scroll', checkFabVisibility);
mainContent.addEventListener('scroll', checkFabVisibility);
window.addEventListener('resize', () => {
  arrangeMobileLayout();
  checkFabVisibility();
});

['shopName','orderDate','supplierName','phone'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', saveCurrentMeta);
  el.addEventListener('change', saveCurrentMeta);
});

// 初始化執行
loadMetaToForm();
renderBlockSelect();
renderPriceOptions();
updateCounts();
renderBlocks();
renderSelected();
renderHistory();
arrangeMobileLayout();

</script>
